    <!-- Styles -->

        :root { --bg: #020617; --card: #0f172a; --border: #1e293b; --text: #f8fafc; --muted: #64748b; --accent: #f1f5f9; --acc-text: #020617; --success: #22c55e; --danger: #ef4444; --warn: #eab308; }
        [data-theme="light"] { --bg: #f8fafc; --card: #ffffff; --border: #cbd5e1; --text: #0f172a; --muted: #64748b; --accent: #0f172a; --acc-text: #ffffff; --success: #16a34a; --danger: #dc2626; --warn: #ca8a04; }
        [data-theme="pure"] { --bg: #000000; --card: #121212; --border: #27272a; --text: #e4e4e7; --muted: #52525b; --accent: #ffffff; --acc-text: #000000; --success: #22c55e; --danger: #ef4444; --warn: #eab308; }
        
        body { background-color: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; transition: 0.3s; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        .theme-card { background-color: var(--card); border: 1px solid var(--border); }
        .theme-btn { background-color: var(--accent); color: var(--acc-text); }
        ::-webkit-scrollbar { width: 0px; }
        input, select, textarea { background-color: var(--bg); color: var(--text); border: 1px solid var(--border); }
        input:focus { outline: none; border-color: var(--muted); }
        .strike-through { text-decoration: line-through; opacity: 0.5; }
        
        /* Animations */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes slideInRight { from { transform: translateX(100%); } to { transform: translateX(0); } }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // --- CONSTANTS & CONFIG ---
        const SUPABASE_URL = 'https://syrhuxxryctrzjdzexnx.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN5cmh1eHhyeWN0cnpqZHpleG54Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjUxMjYzMjUsImV4cCI6MjA4MDcwMjMyNX0.DP4O-USLYPbjGoTwM2fSc8juzLsABrDbGpQ-7CxSAXQ';
        
        const LANG = {
            en: { system: "System", truth: "Truth", goals: "Direction", settings: "Settings", today_win: "Today I win if I complete the system.", architect: "Architect Mode", unlock: "Manage System", locked: "System Sealed", habits: "Habits", score: "Score", save: "Save Data", restore: "Restore Data", steps: "Execution Steps", rules: "Rules", media: "References", timer: "Timer", start: "Start", pause: "Pause", complete: "Complete", fail: "Fail", new_block: "New Habit", edit_block: "Edit Habit", title: "Title", theme: "Appearance", language: "Language", backup: "Data Backup", schedule: "Schedule", reward: "Reward (Optional)", punishment: "Punishment (Optional)", rewards: "Rewards", punishments: "Punishments", seal_contract: "Seal Iron Contract", break_contract: "Break Contract", seal_desc: "Lock editing for X days. It will open normally after the time passes.", days: "Days", reset_day: "Reset Today", week: "Week", month: "Month", shame_phrases: ["I am breaking my promise because I am weak.", "I value comfort over my future."], delete: "Delete", type: "Type", label: "Label", url: "URL", details: "Details" },
            ar: { system: "النظام", truth: "الحقيقة", goals: "الوجهة", settings: "الإعدادات", today_win: "أنتصر اليوم إذا أتممت النظام.", architect: "وضع المهندس", unlock: "تعديل النظام", locked: "النظام مغلق", habits: "العادات", score: "النتيجة", save: "حفظ", restore: "استرجاع", steps: "الخطوات", rules: "القواعد", media: "المراجع", timer: "المؤقت", start: "بدء", pause: "إيقاف", complete: "تم", fail: "فشل", new_block: "عادة جديدة", edit_block: "تعديل", title: "العنوان", theme: "المظهر", language: "اللغة", backup: "النسخ الاحتياطي", schedule: "الجدول", reward: "المكافأة", punishment: "العقوبة", rewards: "المكافآت", punishments: "العقوبات", seal_contract: "ختم العقد", break_contract: "كسر العقد", seal_desc: "قفل التعديل لعدة أيام. سيفتح تلقائياً بعد انقضاء المدة.", days: "أيام", reset_day: "إعادة ضبط اليوم", week: "أسبوع", month: "شهر", shame_phrases: ["أنا أكسر وعدي لنفسي لأني ضعيف.", "راحتي المؤقتة أهم من مستقبلي."], delete: "حذف", type: "النوع", label: "الوصف", url: "الرابط", details: "التفاصيل" },
            de: { system: "System", truth: "Wahrheit", goals: "Ziele", settings: "Einstellungen", today_win: "Heute gewinne ich.", architect: "Architekt", unlock: "Verwalten", locked: "Versiegelt", habits: "Gewohnheiten", score: "Ergebnis", save: "Speichern", restore: "Wiederherstellen", steps: "Schritte", rules: "Regeln", media: "Medien", timer: "Timer", start: "Start", pause: "Pause", complete: "Fertig", fail: "Fehlschlag", new_block: "Neu", edit_block: "Bearbeiten", title: "Titel", theme: "Aussehen", language: "Sprache", backup: "Backup", schedule: "Zeitplan", reward: "Belohnung", punishment: "Strafe", rewards: "Belohnungen", punishments: "Strafen", seal_contract: "Vertrag", break_contract: "Brechen", seal_desc: "Bearbeitung sperren. Öffnet sich automatisch nach Ablauf der Zeit.", days: "Tage", reset_day: "Reset", week: "Woche", month: "Monat", shame_phrases: ["Ich breche mein Versprechen.", "Komfort ist mir wichtiger."], delete: "Löschen", type: "Typ", label: "Label", url: "URL", details: "Details" }
        };

        const DAYS_MAP = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

        // --- INIT SUPABASE ---
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // --- LOCAL & CRYPTO UTILS ---
        function getOrSetLocal(key, generator) {
            let val = localStorage.getItem(key);
            if (!val) { val = generator(); localStorage.setItem(key, val); }
            return val;
        }

        const SESSION_ID = getOrSetLocal('identity_session_id', () => crypto.randomUUID());
        const ENCRYPTION_KEY = getOrSetLocal('identity_encryption_key', () => {
            const a = new Uint8Array(32); window.crypto.getRandomValues(a);
            return Array.from(a, b => b.toString(16).padStart(2, '0')).join('');
        });

        // Safe Encrypt/Decrypt Wrappers
        const encrypt = (t) => {
            try {
                if (t === null || t === undefined || t === '') return '';
                if (typeof t !== 'string') t = String(t);
                return CryptoJS.AES.encrypt(t, ENCRYPTION_KEY).toString();
            } catch (e) { console.error("Encrypt error", e); return ''; }
        };

        const decrypt = (c) => {
            try {
                if (!c || typeof c !== 'string') return c || '';
                const bytes = CryptoJS.AES.decrypt(c, ENCRYPTION_KEY);
                const str = bytes.toString(CryptoJS.enc.Utf8);
                return str || c; // Fallback to original if decrypt fails (legacy data)
            } catch (e) { return c; }
        };

        // Helper to encrypt complex objects/arrays into a string for storage
        const encryptObject = (obj) => {
            try {
                return encrypt(JSON.stringify(obj));
            } catch (e) { return ''; }
        };

        // Helper to decrypt string back to object/array
        const decryptObject = (str) => {
            try {
                const decryptedStr = decrypt(str);
                if (!decryptedStr) return [];
                return JSON.parse(decryptedStr);
            } catch (e) { return []; }
        };

        const getTodayString = () => new Date().toLocaleDateString('en-CA');

        const { useState, useEffect, useRef, useMemo } = React;

        // --- ICONS ---
        const Icon = ({ path, size = 20, className = "", onClick }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} onClick={onClick}>{path}</svg>
        );
        const Icons = {
            Layout: (p) => <Icon {...p} path={<><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></>} />,
            BarChart2: (p) => <Icon {...p} path={<><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></>} />,
            Target: (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></>} />,
            Settings: (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></>} />,
            Play: (p) => <Icon {...p} path={<polygon points="5 3 19 12 5 21 5 3"/>} />,
            Pause: (p) => <Icon {...p} path={<><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></>} />,
            CheckCircle: (p) => <Icon {...p} path={<><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></>} />,
            Check: (p) => <Icon {...p} path={<><polyline points="20 6 9 17 4 12"/></>} />,
            Plus: (p) => <Icon {...p} path={<><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></>} />,
            Edit: (p) => <Icon {...p} path={<><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></>} />,
            Trash: (p) => <Icon {...p} path={<><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></>} />,
            X: (p) => <Icon {...p} path={<><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></>} />,
            Lock: (p) => <Icon {...p} path={<><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></>} />,
            Unlock: (p) => <Icon {...p} path={<><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></>} />,
            ChevronRight: (p) => <Icon {...p} path={<polyline points="9 18 15 12 9 6"/>} />,
            Video: (p) => <Icon {...p} path={<><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></>} />,
            Image: (p) => <Icon {...p} path={<><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></>} />
        };

        // --- MAIN APP ---
        function App() {
            const [activeTab, setActiveTab] = useState('daily');
            const [tasks, setTasks] = useState([]);
            const [goals, setGoals] = useState([]);
            const [history, setHistory] = useState([]);
            const [isLoading, setIsLoading] = useState(true);
            
            // UI State
            const [selectedTaskId, setSelectedTaskId] = useState(null);
            const [isManaging, setIsManaging] = useState(false);
            const [editingTask, setEditingTask] = useState(null);
            const [editingGoal, setEditingGoal] = useState(null);
            const [lockDate, setLockDate] = useState(null);
            
            const [theme, setTheme] = useState(localStorage.getItem('identity_theme') || 'midnight');
            const [lang, setLang] = useState(localStorage.getItem('identity_lang') || 'en');
            
            // Iron Contract Logic: Checks if current time is past lock date
            const isLocked = useMemo(() => {
                if (!lockDate) return false;
                return new Date(lockDate) > new Date();
            }, [lockDate]);

            // Translations
            const t = (k) => LANG[lang][k] || k;

            // Effects
            useEffect(() => {
                document.documentElement.setAttribute('data-theme', theme);
                document.dir = lang === 'ar' ? 'rtl' : 'ltr';
                localStorage.setItem('identity_theme', theme);
                localStorage.setItem('identity_lang', lang);
            }, [theme, lang]);

            // Initial Data Load from Supabase
            useEffect(() => { fetchAllData(); }, []);

            const fetchAllData = async () => {
                setIsLoading(true);
                try {
                    const today = getTodayString();

                    // 1. Settings (Lock Date)
                    const { data: sData } = await supabase.from('identity_settings').select('*').eq('session_id', SESSION_ID).maybeSingle();
                    if (sData) {
                        setLockDate(sData.locked_until);
                        setTheme(sData.theme || 'midnight');
                        setLang(sData.language || 'en');
                    } else {
                        // Init settings if missing
                        await supabase.from('identity_settings').insert({ session_id: SESSION_ID });
                    }

                    // 2. Tasks
                    const { data: tData } = await supabase.from('identity_tasks').select('*').eq('session_id', SESSION_ID).order('start_time');
                    if (tData) {
                        // Reset status for new day
                        const processedTasks = tData.map(task => {
                            if (task.last_active_date !== today) {
                                return { ...task, status: 'idle', consequence_status: 'none', last_active_date: today };
                            }
                            return task;
                        });

                        // Decrypt sensitive fields
                        const decryptedTasks = processedTasks.map(t => ({
                            ...t,
                            title: decrypt(t.title),
                            instructions: decryptObject(t.instructions),
                            rules: decryptObject(t.rules),
                            media_items: decryptObject(t.media_items),
                            reward_text: decrypt(t.reward_text),
                            punishment_text: decrypt(t.punishment_text)
                        }));
                        setTasks(decryptedTasks);

                        // If day changed, update DB immediately
                        const needsUpdate = tData.some(t => t.last_active_date !== today);
                        if (needsUpdate) {
                            const updates = processedTasks.map(t => ({
                                id: t.id,
                                status: 'idle',
                                consequence_status: 'none',
                                last_active_date: today
                            }));
                            await supabase.from('identity_tasks').upsert(updates);
                        }
                    }

                    // 3. Goals
                    const { data: gData } = await supabase.from('identity_goals').select('*').eq('session_id', SESSION_ID);
                    if (gData) {
                        setGoals(gData.map(g => ({
                            ...g,
                            title: decrypt(g.title),
                            timeline: decrypt(g.timeline),
                            linked_systems: decryptObject(g.linked_systems)
                        })));
                    }

                    // 4. History
                    const { data: hData } = await supabase.from('identity_history').select('*').eq('session_id', SESSION_ID);
                    if (hData) setHistory(hData);

                } catch (e) {
                    console.error("Data Load Error:", e);
                } finally {
                    setIsLoading(false);
                }
            };

            // --- CRUD ACTIONS ---

            const updateHistoryScore = async (currentTasks) => {
                const today = getTodayString();
                const total = currentTasks.length;
                const completed = currentTasks.filter(t => t.status === 'completed').length;
                const score = total === 0 ? 0 : Math.round((completed / total) * 100);

                // Optimistic UI
                setHistory(prev => {
                    const idx = prev.findIndex(h => h.date === today);
                    if (idx >= 0) {
                        const newH = [...prev];
                        newH[idx] = { ...newH[idx], score };
                        return newH;
                    }
                    return [...prev, { date: today, score, session_id: SESSION_ID }];
                });

                // DB Update
                await supabase.from('identity_history').upsert({
                    session_id: SESSION_ID,
                    date: today,
                    score: score
                }, { onConflict: 'session_id,date' });
            };

            const handleSaveTask = async (task) => {
                // Ensure array/object fields are arrays
                const cleanTask = {
                    ...task,
                    instructions: Array.isArray(task.instructions) ? task.instructions : [],
                    rules: Array.isArray(task.rules) ? task.rules : [],
                    media_items: Array.isArray(task.media_items) ? task.media_items : [],
                    schedule_days: Array.isArray(task.schedule_days) ? task.schedule_days : [0,1,2,3,4,5,6]
                };

                const payload = {
                    session_id: SESSION_ID,
                    title: encrypt(cleanTask.title),
                    start_time: cleanTask.start_time,
                    end_time: cleanTask.end_time,
                    schedule_days: cleanTask.schedule_days, // JSONB handles array directly
                    instructions: encryptObject(cleanTask.instructions),
                    rules: encryptObject(cleanTask.rules),
                    media_items: encryptObject(cleanTask.media_items),
                    reward_text: encrypt(cleanTask.reward_text),
                    punishment_text: encrypt(cleanTask.punishment_text),
                    status: cleanTask.status || 'idle',
                    consequence_status: cleanTask.consequence_status || 'none',
                    last_active_date: getTodayString()
                };

                let updatedTasks = [...tasks];

                if (task.id === 'new') {
                    const { data, error } = await supabase.from('identity_tasks').insert([payload]).select().single();
                    if (data) {
                        const newTask = { ...cleanTask, id: data.id };
                        updatedTasks = [...tasks, newTask];
                        setTasks(updatedTasks);
                    }
                } else {
                    await supabase.from('identity_tasks').update(payload).eq('id', cleanTask.id);
                    updatedTasks = tasks.map(t => t.id === cleanTask.id ? cleanTask : t);
                    setTasks(updatedTasks);
                }

                await updateHistoryScore(updatedTasks);
                setEditingTask(null);
            };

            const handleDeleteTask = async (id) => {
                if (!confirm(t('delete') + "?")) return;
                await supabase.from('identity_tasks').delete().eq('id', id);
                const newTasks = tasks.filter(t => t.id !== id);
                setTasks(newTasks);
                await updateHistoryScore(newTasks);
                setEditingTask(null);
            };

            const handleTaskStateChange = async (id, type) => {
                let changes = {};
                if (type === 'complete') changes = { status: 'completed', consequence_status: 'reward_pending' };
                else if (type === 'fail') changes = { status: 'failed', consequence_status: 'punishment_pending' };
                else if (type === 'pay_punishment') changes = { consequence_status: 'punishment_paid' };
                else if (type === 'claim_reward') changes = { consequence_status: 'reward_taken' };

                const newTasks = tasks.map(t => t.id === id ? { ...t, ...changes } : t);
                setTasks(newTasks);
                await supabase.from('identity_tasks').update(changes).eq('id', id);
                await updateHistoryScore(newTasks);
            };

            const handleSaveGoal = async (goal) => {
                const cleanGoal = {
                    ...goal,
                    linked_systems: Array.isArray(goal.linked_systems) ? goal.linked_systems : []
                };

                const payload = {
                    session_id: SESSION_ID,
                    title: encrypt(cleanGoal.title),
                    timeline: encrypt(cleanGoal.timeline),
                    linked_systems: encryptObject(cleanGoal.linked_systems),
                    is_completed: cleanGoal.is_completed || false
                };

                let updatedGoals = [...goals];

                if (goal.id === 'new') {
                    const { data } = await supabase.from('identity_goals').insert([payload]).select().single();
                    if (data) {
                        updatedGoals = [...goals, { ...cleanGoal, id: data.id }];
                    }
                } else {
                    await supabase.from('identity_goals').update(payload).eq('id', cleanGoal.id);
                    updatedGoals = goals.map(g => g.id === cleanGoal.id ? cleanGoal : g);
                }
                setGoals(updatedGoals);
                setEditingGoal(null);
            };

            const handleDeleteGoal = async (id) => {
                if (!confirm(t('delete') + "?")) return;
                await supabase.from('identity_goals').delete().eq('id', id);
                setGoals(goals.filter(g => g.id !== id));
                setEditingGoal(null);
            };

            // --- SETTINGS ACTIONS ---
            const sealContract = async (days) => {
                if (!confirm(`Lock system for ${days} days?`)) return;
                const futureDate = new Date();
                futureDate.setDate(futureDate.getDate() + days);
                const isoDate = futureDate.toISOString();
                
                await supabase.from('identity_settings').upsert({ session_id: SESSION_ID, locked_until: isoDate });
                setLockDate(isoDate);
            };

            const breakContract = async () => {
                const phrase = LANG[lang].shame_phrases[0]; // Simplified for UX
                const input = prompt(`${t('break_contract')}\nType: "${phrase}"`);
                if (input === phrase) {
                    await supabase.from('identity_settings').upsert({ session_id: SESSION_ID, locked_until: null });
                    setLockDate(null);
                } else {
                    alert("Incorrect.");
                }
            };

            return (
                <div className="flex flex-col h-[100dvh]">
                    {isLoading && <div className="fixed inset-0 bg-black/90 z-50 flex items-center justify-center text-white">Loading Architecture...</div>}

                    {/* MAIN CONTENT AREA */}
                    <main className="flex-1 overflow-y-auto pb-24 md:pb-0 md:pt-20 px-4 py-6 w-full max-w-2xl mx-auto">
                        
                        {activeTab === 'daily' && (
                            <DailyView 
                                tasks={tasks} 
                                isManaging={isManaging} 
                                isLocked={isLocked}
                                t={t}
                                onToggleManage={() => setIsManaging(!isManaging)}
                                onEdit={setEditingTask}
                                onSelect={setSelectedTaskId}
                                onNew={() => setEditingTask({ id: 'new', title: '', start_time: '', end_time: '', schedule_days: [0,1,2,3,4,5,6], instructions: [], rules: [], media_items: [] })}
                                onStateChange={handleTaskStateChange}
                            />
                        )}

                        {activeTab === 'progress' && (
                            <ProgressView history={history} t={t} />
                        )}

                        {activeTab === 'goals' && (
                            <GoalsView 
                                goals={goals} 
                                isManaging={isManaging && !isLocked}
                                t={t}
                                onToggleManage={() => setIsManaging(!isManaging)}
                                onEdit={setEditingGoal}
                                onNew={() => setEditingGoal({ id: 'new', title: '', timeline: '', linked_systems: [] })}
                                onCheck={async (g) => {
                                    const newG = { ...g, is_completed: !g.is_completed };
                                    handleSaveGoal(newG);
                                }}
                            />
                        )}

                        {activeTab === 'settings' && (
                            <SettingsView 
                                t={t} 
                                isLocked={isLocked}
                                theme={theme} setTheme={setTheme}
                                lang={lang} setLang={setLang}
                                onSeal={sealContract}
                                onBreak={breakContract}
                            />
                        )}
                    </main>

                    {/* NAVIGATION */}
                    <nav className="fixed bottom-0 w-full bg-[var(--card)] border-t border-[var(--border)] z-40 flex justify-around p-3 pb-safe md:top-0 md:bottom-auto md:justify-center md:gap-12 shadow-2xl">
                        <NavButton icon={Icons.Layout} label={t('system')} active={activeTab === 'daily'} onClick={() => setActiveTab('daily')} />
                        <NavButton icon={Icons.BarChart2} label={t('truth')} active={activeTab === 'progress'} onClick={() => setActiveTab('progress')} />
                        <NavButton icon={Icons.Target} label={t('goals')} active={activeTab === 'goals'} onClick={() => setActiveTab('goals')} />
                        <NavButton icon={Icons.Settings} label={t('settings')} active={activeTab === 'settings'} onClick={() => setActiveTab('settings')} />
                    </nav>

                    {/* MODALS / DRAWERS */}
                    {selectedTaskId && (
                        <TaskDrawer 
                            task={tasks.find(t => t.id === selectedTaskId)} 
                            t={t}
                            onClose={() => setSelectedTaskId(null)}
                            onStateChange={handleTaskStateChange}
                        />
                    )}

                    {editingTask && (
                        <TaskEditor 
                            task={editingTask} 
                            t={t}
                            onSave={handleSaveTask}
                            onDelete={handleDeleteTask}
                            onClose={() => setEditingTask(null)}
                        />
                    )}

                    {editingGoal && (
                        <GoalEditor 
                            goal={editingGoal}
                            t={t}
                            onSave={handleSaveGoal}
                            onDelete={handleDeleteGoal}
                            onClose={() => setEditingGoal(null)}
                        />
                    )}
                </div>
            );
        }

        // --- SUB-COMPONENTS ---

        function DailyView({ tasks, isManaging, isLocked, t, onToggleManage, onEdit, onSelect, onNew, onStateChange }) {
            const todayIndex = new Date().getDay();
            const visibleTasks = tasks.filter(t => {
                if (isManaging) return true;
                return Array.isArray(t.schedule_days) && t.schedule_days.includes(todayIndex);
            }).sort((a,b) => (a.start_time || '').localeCompare(b.start_time || ''));

            const doneCount = visibleTasks.filter(t => t.status === 'completed').length;
            const progress = visibleTasks.length > 0 ? Math.round((doneCount / visibleTasks.length) * 100) : 0;

            return (
                <div className="space-y-6 animate-[fadeIn_0.5s_ease-out]">
                    <header className="border-l-4 border-[var(--muted)] pl-4 py-2">
                        <h1 className="text-xl font-bold">{isManaging ? t('architect') : t('today_win')}</h1>
                        {!isManaging && (
                            <div className="h-1.5 w-full bg-[var(--border)] mt-2 rounded-full overflow-hidden">
                                <div className="h-full bg-[var(--accent)] transition-all duration-500" style={{ width: `${progress}%` }}></div>
                            </div>
                        )}
                    </header>

                    <div className="space-y-3 pb-20">
                        {visibleTasks.map(task => (
                            <div key={task.id} className="relative group">
                                <div 
                                    onClick={() => isManaging ? onEdit(task) : (task.status !== 'completed' && task.status !== 'failed' && onSelect(task.id))}
                                    className={`p-4 rounded-lg border flex items-center gap-4 transition-all
                                    ${isManaging ? 'bg-[var(--card)] border-[var(--border)] cursor-pointer' : 
                                      task.status === 'completed' ? 'bg-[var(--card)] border-[var(--success)] opacity-60' :
                                      task.status === 'failed' ? 'bg-[var(--card)] border-[var(--danger)]' :
                                      'bg-[var(--card)] border-[var(--border)] hover:border-[var(--muted)] cursor-pointer active:scale-95'}`}
                                >
                                    <div className="w-12 text-xs font-mono text-[var(--muted)] text-right">
                                        <div>{task.start_time || '--:--'}</div>
                                        <div className="opacity-50">{task.end_time || '--:--'}</div>
                                    </div>
                                    <div className={`w-3 h-3 rounded-full shrink-0 ${task.status === 'completed' ? 'bg-[var(--success)]' : task.status === 'failed' ? 'bg-[var(--danger)]' : 'bg-[var(--border)]'}`}></div>
                                    <div className="flex-1">
                                        <h3 className={`font-bold ${task.status === 'completed' ? 'line-through text-[var(--muted)]' : ''}`}>{task.title || 'Untitled'}</h3>
                                    </div>
                                    {isManaging && <Icons.Edit className="text-[var(--muted)]" size={16} />}
                                    {!isManaging && task.status === 'completed' && <Icons.CheckCircle className="text-[var(--success)]" size={20} />}
                                    {!isManaging && task.status === 'failed' && <Icons.X className="text-[var(--danger)]" size={20} />}
                                </div>
                                
                                {/* Punishment UI */}
                                {task.status === 'failed' && task.punishment_text && (
                                    <div className="ml-16 mt-2 p-3 border border-dashed border-[var(--danger)] rounded bg-[var(--bg)] flex justify-between items-center">
                                        <span className="text-xs text-[var(--danger)] font-bold">{t('punishment')}: {task.punishment_text}</span>
                                        <button 
                                            onClick={() => onStateChange(task.id, 'pay_punishment')}
                                            disabled={task.consequence_status === 'punishment_paid'}
                                            className={`w-6 h-6 flex items-center justify-center rounded border ${task.consequence_status === 'punishment_paid' ? 'bg-[var(--danger)] border-[var(--danger)] text-white' : 'border-[var(--danger)] text-[var(--danger)]'}`}
                                        >
                                            <Icons.Check size={14} />
                                        </button>
                                    </div>
                                )}
                            </div>
                        ))}
                        
                        {isManaging && (
                            <button onClick={onNew} className="w-full py-4 border-2 border-dashed border-[var(--border)] rounded-lg flex items-center justify-center gap-2 text-[var(--muted)] hover:text-[var(--text)] hover:border-[var(--muted)] transition-all">
                                <Icons.Plus size={20} /> <span className="text-xs font-bold uppercase">{t('new_block')}</span>
                            </button>
                        )}
                        
                        <div className="flex justify-center pt-8">
                             {!isLocked ? (
                                <button onClick={onToggleManage} className={`flex items-center gap-2 px-4 py-2 rounded-full text-xs font-mono transition-colors ${isManaging ? 'bg-[var(--warn)] text-black' : 'text-[var(--muted)] hover:bg-[var(--card)]'}`}>
                                    {isManaging ? <><Icons.Unlock size={14}/> {t('unlock')}</> : <><Icons.Lock size={14}/> {t('architect')}</>}
                                </button>
                             ) : (
                                <div className="text-[var(--success)] text-xs font-mono flex items-center gap-2">
                                    <Icons.Lock size={14} /> {t('locked')}
                                </div>
                             )}
                        </div>
                    </div>
                </div>
            );
        }

        function ProgressView({ history, t }) {
            // Transform history into last 30 days data
            const chartData = useMemo(() => {
                const data = [];
                const today = new Date();
                for (let i = 29; i >= 0; i--) {
                    const d = new Date();
                    d.setDate(today.getDate() - i);
                    const dateStr = d.toLocaleDateString('en-CA');
                    const record = history.find(h => h.date === dateStr);
                    data.push({
                        date: dateStr,
                        day: d.toLocaleDateString('en-US', { weekday: 'narrow' }),
                        score: record ? record.score : 0,
                        hasData: !!record
                    });
                }
                return data;
            }, [history]);

            const avgScore = Math.round(chartData.reduce((acc, curr) => acc + curr.score, 0) / 30);
            
            return (
                <div className="space-y-8 animate-[fadeIn_0.5s_ease-out]">
                    <div className="p-6 rounded-xl border border-[var(--border)] bg-[var(--card)] text-center">
                        <div className="text-xs font-bold uppercase text-[var(--muted)] tracking-widest mb-2">30 Day Consistency</div>
                        <div className="text-4xl font-bold text-[var(--accent)]">{avgScore}%</div>
                    </div>
                    
                    <div className="h-48 flex items-end justify-between gap-1 p-4 border border-[var(--border)] rounded-xl bg-[var(--card)]">
                        {chartData.map((d, i) => (
                            <div key={i} className="flex-1 flex flex-col justify-end h-full gap-1 group relative">
                                <div 
                                    className={`w-full rounded-t-sm transition-all duration-500 ${d.score === 100 ? 'bg-[var(--success)]' : d.hasData ? 'bg-[var(--accent)]' : 'bg-[var(--border)]'}`}
                                    style={{ height: `${d.score}%`, minHeight: '4px' }}
                                ></div>
                                {/* Tooltip */}
                                <div className="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 bg-black text-white text-[10px] px-2 py-1 rounded opacity-0 group-hover:opacity-100 whitespace-nowrap z-10 pointer-events-none">
                                    {d.date}: {d.score}%
                                </div>
                            </div>
                        ))}
                    </div>
                    <div className="text-center text-xs text-[var(--muted)]">Last 30 Days Activity</div>
                </div>
            );
        }

        function GoalsView({ goals, isManaging, t, onToggleManage, onEdit, onNew, onCheck }) {
            return (
                <div className="space-y-8 animate-[fadeIn_0.5s_ease-out]">
                    <div className="flex justify-between items-center border-b border-[var(--border)] pb-4">
                        <h1 className="text-xl font-bold">{t('goals')}</h1>
                        {isManaging && <button onClick={onNew} className="text-xs font-bold uppercase text-[var(--accent)]">+ {t('new_block')}</button>}
                        {!isManaging && <button onClick={onToggleManage} className="text-xs text-[var(--muted)]">{t('architect')}</button>}
                    </div>

                    <div className="grid gap-4">
                        {goals.map(g => (
                            <div key={g.id} className={`p-6 rounded-xl border transition-all ${g.is_completed ? 'border-[var(--success)] bg-[var(--success)]/5 opacity-70' : 'border-[var(--border)] bg-[var(--card)]'}`}>
                                <div className="flex justify-between items-start">
                                    <div className="flex-1">
                                        <h3 className={`text-lg font-bold ${g.is_completed ? 'line-through text-[var(--muted)]' : ''}`}>{g.title || 'Untitled'}</h3>
                                        <span className="text-xs font-mono bg-[var(--bg)] px-2 py-1 rounded text-[var(--muted)] mt-2 inline-block">{g.timeline}</span>
                                    </div>
                                    <button onClick={() => onCheck(g)} className={`w-6 h-6 rounded border flex items-center justify-center ${g.is_completed ? 'bg-[var(--success)] border-transparent text-black' : 'border-[var(--muted)]'}`}>
                                        {g.is_completed && <Icons.Check size={14} />}
                                    </button>
                                </div>
                                
                                {g.linked_systems && g.linked_systems.length > 0 && (
                                    <div className="mt-4 space-y-2">
                                        <p className="text-[10px] uppercase font-bold text-[var(--muted)]">Systems:</p>
                                        {g.linked_systems.map((s, i) => (
                                            <div key={i} className="flex items-center gap-2 text-sm text-[var(--muted)]">
                                                <Icons.Target size={12} /> {s.text || s}
                                            </div>
                                        ))}
                                    </div>
                                )}
                                
                                {isManaging && (
                                    <button onClick={() => onEdit(g)} className="mt-4 text-xs text-[var(--muted)] underline">{t('edit_block')}</button>
                                )}
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function SettingsView({ t, isLocked, theme, setTheme, lang, setLang, onSeal, onBreak }) {
            return (
                <div className="space-y-8 animate-[fadeIn_0.5s_ease-out]">
                    <h1 className="text-xl font-bold border-b border-[var(--border)] pb-4">{t('settings')}</h1>
                    
                    {/* Iron Contract */}
                    <div className={`p-6 rounded-xl border ${isLocked ? 'border-[var(--success)] bg-[var(--success)]/10' : 'border-[var(--border)] bg-[var(--card)]'}`}>
                        <h2 className="text-xs font-bold uppercase tracking-widest text-[var(--muted)] mb-2">{t('seal_contract')}</h2>
                        <p className="text-sm text-[var(--muted)] mb-4">{t('seal_desc')}</p>
                        
                        {!isLocked ? (
                            <div className="flex gap-2">
                                {[1, 7, 30].map(d => (
                                    <button key={d} onClick={() => onSeal(d)} className="flex-1 py-3 bg-[var(--bg)] border border-[var(--border)] rounded text-xs font-bold hover:bg-[var(--accent)] hover:text-black transition-colors">
                                        {d} {t('days')}
                                    </button>
                                ))}
                            </div>
                        ) : (
                            <div className="text-center">
                                <div className="text-[var(--success)] font-bold mb-4 flex items-center justify-center gap-2">
                                    <Icons.Lock size={16}/> {t('locked')}
                                </div>
                                <button onClick={onBreak} className="text-xs text-[var(--danger)] underline">{t('break_contract')}</button>
                            </div>
                        )}
                    </div>

                    {/* Appearance */}
                    <div className="p-6 rounded-xl border border-[var(--border)] bg-[var(--card)]">
                        <h2 className="text-xs font-bold uppercase tracking-widest text-[var(--muted)] mb-4">{t('theme')}</h2>
                        <div className="flex gap-2">
                            {['midnight', 'pure', 'light'].map(th => (
                                <button key={th} onClick={() => setTheme(th)} className={`flex-1 py-2 rounded text-xs font-bold capitalize ${theme === th ? 'bg-[var(--accent)] text-black' : 'bg-[var(--bg)] text-[var(--muted)]'}`}>
                                    {th}
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* Language */}
                    <div className="p-6 rounded-xl border border-[var(--border)] bg-[var(--card)]">
                        <h2 className="text-xs font-bold uppercase tracking-widest text-[var(--muted)] mb-4">{t('language')}</h2>
                        <div className="flex gap-2">
                            {['en', 'ar', 'de'].map(l => (
                                <button key={l} onClick={() => setLang(l)} className={`flex-1 py-2 rounded text-xs font-bold uppercase ${lang === l ? 'bg-[var(--accent)] text-black' : 'bg-[var(--bg)] text-[var(--muted)]'}`}>
                                    {l}
                                </button>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        // --- DRAWERS & MODALS ---

        function TaskDrawer({ task, t, onClose, onStateChange }) {
            const [timer, setTimer] = useState(0);
            const [isActive, setIsActive] = useState(false);
            const intervalRef = useRef(null);

            useEffect(() => {
                if (isActive) {
                    intervalRef.current = setInterval(() => setTimer(t => t + 1), 1000);
                } else {
                    clearInterval(intervalRef.current);
                }
                return () => clearInterval(intervalRef.current);
            }, [isActive]);

            const formatTime = (s) => {
                const mins = Math.floor(s / 60).toString().padStart(2, '0');
                const secs = (s % 60).toString().padStart(2, '0');
                return `${mins}:${secs}`;
            };

            const renderMedia = (m, i) => {
                if (m.type === 'youtube' || (m.url && m.url.includes('youtu'))) {
                    const videoId = m.url.split('v=')[1]?.split('&')[0] || m.url.split('/').pop();
                    return (
                        <div key={i} className="mb-4">
                            <p className="text-xs text-[var(--muted)] mb-1">{m.label}</p>
                            <iframe className="w-full aspect-video rounded" src={`https://www.youtube.com/embed/${videoId}`} allowFullScreen></iframe>
                        </div>
                    );
                }
                if (m.type === 'image') {
                    return (
                        <div key={i} className="mb-4">
                            <p className="text-xs text-[var(--muted)] mb-1">{m.label}</p>
                            <img src={m.url} className="w-full rounded border border-[var(--border)]" loading="lazy" />
                        </div>
                    );
                }
                return (
                    <a key={i} href={m.url} target="_blank" className="block p-3 mb-2 bg-[var(--bg)] rounded border border-[var(--border)] text-sm text-blue-400 truncate">
                        {m.label || m.url}
                    </a>
                );
            };

            return (
                <div className="fixed inset-0 z-50 flex justify-end">
                    <div className="absolute inset-0 bg-black/80 backdrop-blur-sm" onClick={onClose}></div>
                    <div className="relative w-full md:w-[600px] h-full bg-[var(--card)] border-l border-[var(--border)] flex flex-col animate-[slideInRight_0.3s_ease-out]">
                        
                        {/* Header */}
                        <div className="p-6 border-b border-[var(--border)] flex justify-between items-start">
                            <div>
                                <h2 className="text-2xl font-bold">{task.title}</h2>
                                <p className="font-mono text-[var(--muted)]">{task.start_time} - {task.end_time}</p>
                            </div>
                            <button onClick={onClose}><Icons.X className="text-[var(--muted)]" /></button>
                        </div>

                        {/* Content */}
                        <div className="flex-1 overflow-y-auto p-6 space-y-8">
                            {/* Rules */}
                            {task.rules?.length > 0 && (
                                <div className="flex flex-wrap gap-2">
                                    {task.rules.map((r, i) => (
                                        <span key={i} className="px-3 py-1 text-xs font-bold uppercase text-[var(--danger)] border border-[var(--danger)] rounded bg-[var(--danger)]/10">
                                            {r.text}
                                        </span>
                                    ))}
                                </div>
                            )}

                            {/* Steps */}
                            <div>
                                <h3 className="text-xs font-bold uppercase text-[var(--muted)] mb-3">{t('steps')}</h3>
                                {task.instructions?.length > 0 ? (
                                    <ul className="space-y-3">
                                        {task.instructions.map((step, i) => (
                                            <li key={i} className="flex gap-3 p-4 bg-[var(--bg)] rounded border border-[var(--border)]">
                                                <div className="mt-1.5 w-1.5 h-1.5 rounded-full bg-[var(--muted)] shrink-0"></div>
                                                <span className="text-sm leading-relaxed">{step.text}</span>
                                            </li>
                                        ))}
                                    </ul>
                                ) : <p className="text-sm italic text-[var(--muted)]">No steps defined.</p>}
                            </div>

                            {/* Media */}
                            {task.media_items?.length > 0 && (
                                <div>
                                    <h3 className="text-xs font-bold uppercase text-[var(--muted)] mb-3">{t('media')}</h3>
                                    {task.media_items.map(renderMedia)}
                                </div>
                            )}

                            {/* Timer */}
                            <div className="p-8 bg-[var(--bg)] rounded-xl border border-[var(--border)] text-center">
                                <div className="text-5xl font-mono font-bold mb-6">{formatTime(timer)}</div>
                                <div className="flex justify-center gap-4">
                                    <button onClick={() => setIsActive(!isActive)} className="px-6 py-3 bg-[var(--accent)] text-black rounded-lg font-bold flex items-center gap-2">
                                        {isActive ? <><Icons.Pause size={18} /> {t('pause')}</> : <><Icons.Play size={18} /> {t('start')}</>}
                                    </button>
                                </div>
                            </div>
                        </div>

                        {/* Actions */}
                        <div className="p-6 border-t border-[var(--border)] flex gap-4 bg-[var(--bg)]">
                            <button onClick={() => { onStateChange(task.id, 'fail'); onClose(); }} className="flex-1 py-4 text-[var(--danger)] font-bold border border-[var(--danger)] rounded-lg hover:bg-[var(--danger)]/10">
                                {t('fail')}
                            </button>
                            <button onClick={() => { onStateChange(task.id, 'complete'); onClose(); }} className="flex-1 py-4 bg-[var(--success)] text-black font-bold rounded-lg hover:brightness-110">
                                {t('complete')}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function TaskEditor({ task, t, onSave, onDelete, onClose }) {
            const [form, setForm] = useState(JSON.parse(JSON.stringify(task))); // Deep copy
            const [activeSection, setActiveSection] = useState('main');

            const update = (field, val) => setForm(p => ({ ...p, [field]: val }));
            
            // List Helpers
            const addToList = (listName, emptyObj) => setForm(p => ({ ...p, [listName]: [...(p[listName] || []), emptyObj] }));
            const updateInList = (listName, idx, field, val) => {
                const list = [...(form[listName] || [])];
                list[idx][field] = val;
                update(listName, list);
            };
            const removeFromList = (listName, idx) => {
                const list = [...(form[listName] || [])];
                list.splice(idx, 1);
                update(listName, list);
            };

            const toggleDay = (d) => {
                let days = form.schedule_days || [];
                if (days.includes(d)) days = days.filter(x => x !== d);
                else days = [...days, d].sort();
                update('schedule_days', days);
            };

            return (
                <div className="fixed inset-0 z-[70] flex justify-center items-center bg-black/90 backdrop-blur p-4">
                    <div className="w-full max-w-2xl bg-[var(--card)] border border-[var(--border)] rounded-xl flex flex-col max-h-[90vh]">
                        {/* Header */}
                        <div className="p-4 border-b border-[var(--border)] flex justify-between items-center">
                            <h2 className="font-bold">{task.id === 'new' ? t('new_block') : t('edit_block')}</h2>
                            <button onClick={onClose}><Icons.X /></button>
                        </div>

                        {/* Tabs */}
                        <div className="flex border-b border-[var(--border)]">
                            {['main', 'details', 'media'].map(s => (
                                <button key={s} onClick={() => setActiveSection(s)} className={`flex-1 py-3 text-xs font-bold uppercase ${activeSection === s ? 'bg-[var(--accent)] text-black' : 'text-[var(--muted)]'}`}>
                                    {s}
                                </button>
                            ))}
                        </div>

                        {/* Body */}
                        <div className="flex-1 overflow-y-auto p-6 space-y-6">
                            
                            {activeSection === 'main' && (
                                <>
                                    <div>
                                        <label className="block text-xs uppercase text-[var(--muted)] mb-1">{t('title')}</label>
                                        <input value={form.title} onChange={e => update('title', e.target.value)} className="w-full p-3 rounded bg-[var(--bg)] border border-[var(--border)]" />
                                    </div>
                                    <div className="flex gap-4">
                                        <div className="flex-1">
                                            <label className="block text-xs uppercase text-[var(--muted)] mb-1">Start</label>
                                            <input type="time" value={form.start_time} onChange={e => update('start_time', e.target.value)} className="w-full p-3 rounded bg-[var(--bg)] border border-[var(--border)]" />
                                        </div>
                                        <div className="flex-1">
                                            <label className="block text-xs uppercase text-[var(--muted)] mb-1">End</label>
                                            <input type="time" value={form.end_time} onChange={e => update('end_time', e.target.value)} className="w-full p-3 rounded bg-[var(--bg)] border border-[var(--border)]" />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-xs uppercase text-[var(--muted)] mb-2">{t('schedule')}</label>
                                        <div className="flex gap-1">
                                            {DAYS_MAP.map((d, i) => (
                                                <button key={d} onClick={() => toggleDay(i)} className={`flex-1 py-2 rounded text-xs font-bold ${form.schedule_days?.includes(i) ? 'bg-[var(--accent)] text-black' : 'bg-[var(--bg)] border border-[var(--border)]'}`}>
                                                    {d}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-xs uppercase text-[var(--success)] mb-1">{t('reward')}</label>
                                        <input value={form.reward_text || ''} onChange={e => update('reward_text', e.target.value)} className="w-full p-3 rounded bg-[var(--bg)] border border-[var(--border)]" />
                                    </div>
                                    <div>
                                        <label className="block text-xs uppercase text-[var(--danger)] mb-1">{t('punishment')}</label>
                                        <input value={form.punishment_text || ''} onChange={e => update('punishment_text', e.target.value)} className="w-full p-3 rounded bg-[var(--bg)] border border-[var(--border)]" />
                                    </div>
                                </>
                            )}

                            {activeSection === 'details' && (
                                <>
                                    {/* Rules */}
                                    <div>
                                        <div className="flex justify-between mb-2">
                                            <label className="text-xs uppercase text-[var(--muted)]">{t('rules')}</label>
                                            <button onClick={() => addToList('rules', {text: ''})} className="text-xs text-[var(--accent)]">+ Add</button>
                                        </div>
                                        {form.rules?.map((r, i) => (
                                            <div key={i} className="flex gap-2 mb-2">
                                                <input value={r.text} onChange={e => updateInList('rules', i, 'text', e.target.value)} className="flex-1 p-2 bg-[var(--bg)] border border-[var(--border)] rounded" />
                                                <button onClick={() => removeFromList('rules', i)} className="text-[var(--danger)]"><Icons.Trash size={16}/></button>
                                            </div>
                                        ))}
                                    </div>
                                    {/* Steps */}
                                    <div>
                                        <div className="flex justify-between mb-2">
                                            <label className="text-xs uppercase text-[var(--muted)]">{t('steps')}</label>
                                            <button onClick={() => addToList('instructions', {text: ''})} className="text-xs text-[var(--accent)]">+ Add</button>
                                        </div>
                                        {form.instructions?.map((inst, i) => (
                                            <div key={i} className="flex gap-2 mb-2">
                                                <textarea rows="2" value={inst.text} onChange={e => updateInList('instructions', i, 'text', e.target.value)} className="flex-1 p-2 bg-[var(--bg)] border border-[var(--border)] rounded resize-none" />
                                                <button onClick={() => removeFromList('instructions', i)} className="text-[var(--danger)]"><Icons.Trash size={16}/></button>
                                            </div>
                                        ))}
                                    </div>
                                </>
                            )}

                            {activeSection === 'media' && (
                                <div>
                                    <div className="flex justify-between mb-2">
                                        <label className="text-xs uppercase text-[var(--muted)]">{t('media')}</label>
                                        <button onClick={() => addToList('media_items', {type: 'link', url: '', label: ''})} className="text-xs text-[var(--accent)]">+ Add</button>
                                    </div>
                                    {form.media_items?.map((m, i) => (
                                        <div key={i} className="p-3 bg-[var(--bg)] border border-[var(--border)] rounded mb-3">
                                            <div className="flex gap-2 mb-2">
                                                <select value={m.type} onChange={e => updateInList('media_items', i, 'type', e.target.value)} className="p-2 bg-[var(--card)] border border-[var(--border)] rounded text-xs">
                                                    <option value="link">Link</option>
                                                    <option value="image">Image</option>
                                                    <option value="youtube">YouTube</option>
                                                </select>
                                                <input placeholder="Label" value={m.label} onChange={e => updateInList('media_items', i, 'label', e.target.value)} className="flex-1 p-2 bg-[var(--card)] border border-[var(--border)] rounded text-xs" />
                                                <button onClick={() => removeFromList('media_items', i)} className="text-[var(--danger)]"><Icons.Trash size={16}/></button>
                                            </div>
                                            <input placeholder="URL" value={m.url} onChange={e => updateInList('media_items', i, 'url', e.target.value)} className="w-full p-2 bg-[var(--card)] border border-[var(--border)] rounded text-xs" />
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>

                        {/* Footer */}
                        <div className="p-4 border-t border-[var(--border)] flex justify-between">
                            {task.id !== 'new' ? (
                                <button onClick={() => onDelete(task.id)} className="text-[var(--danger)] text-xs font-bold uppercase">{t('delete')}</button>
                            ) : <div></div>}
                            <button onClick={() => onSave(form)} className="px-6 py-2 bg-[var(--accent)] text-black font-bold rounded hover:brightness-110">
                                {t('save')}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function GoalEditor({ goal, t, onSave, onDelete, onClose }) {
            const [form, setForm] = useState(JSON.parse(JSON.stringify(goal)));
            
            const addLink = () => setForm(p => ({ ...p, linked_systems: [...(p.linked_systems || []), { text: '' }] }));
            const updateLink = (i, val) => {
                const list = [...(form.linked_systems || [])];
                list[i].text = val;
                setForm(p => ({ ...p, linked_systems: list }));
            };
            const removeLink = (i) => {
                const list = [...(form.linked_systems || [])];
                list.splice(i, 1);
                setForm(p => ({ ...p, linked_systems: list }));
            };

            return (
                <div className="fixed inset-0 z-[70] flex justify-center items-center bg-black/90 backdrop-blur p-4">
                    <div className="w-full max-w-lg bg-[var(--card)] border border-[var(--border)] rounded-xl flex flex-col">
                        <div className="p-4 border-b border-[var(--border)] flex justify-between items-center">
                            <h2 className="font-bold">Goal</h2>
                            <button onClick={onClose}><Icons.X /></button>
                        </div>
                        <div className="p-6 space-y-4">
                            <div>
                                <label className="block text-xs uppercase text-[var(--muted)] mb-1">{t('title')}</label>
                                <input value={form.title} onChange={e => setForm({...form, title: e.target.value})} className="w-full p-3 rounded bg-[var(--bg)] border border-[var(--border)]" />
                            </div>
                            <div>
                                <label className="block text-xs uppercase text-[var(--muted)] mb-1">Timeline</label>
                                <input value={form.timeline} onChange={e => setForm({...form, timeline: e.target.value})} className="w-full p-3 rounded bg-[var(--bg)] border border-[var(--border)]" />
                            </div>
                            <div>
                                <div className="flex justify-between mb-2">
                                    <label className="text-xs uppercase text-[var(--muted)]">Linked Systems</label>
                                    <button onClick={addLink} className="text-xs text-[var(--accent)]">+ Add</button>
                                </div>
                                {form.linked_systems?.map((l, i) => (
                                    <div key={i} className="flex gap-2 mb-2">
                                        <input value={l.text} onChange={e => updateLink(i, e.target.value)} className="flex-1 p-2 bg-[var(--bg)] border border-[var(--border)] rounded" />
                                        <button onClick={() => removeLink(i)} className="text-[var(--danger)]"><Icons.Trash size={16}/></button>
                                    </div>
                                ))}
                            </div>
                        </div>
                        <div className="p-4 border-t border-[var(--border)] flex justify-between">
                            {goal.id !== 'new' ? <button onClick={onDelete} className="text-[var(--danger)] text-xs font-bold uppercase">{t('delete')}</button> : <div></div>}
                            <button onClick={() => onSave(form)} className="px-6 py-2 bg-[var(--accent)] text-black font-bold rounded">{t('save')}</button>
                        </div>
                    </div>
                </div>
            );
        }

        function NavButton({ icon: Icon, label, active, onClick }) {
            return (
                <button onClick={onClick} className={`flex flex-col items-center gap-1 p-2 rounded transition-all ${active ? 'text-[var(--accent)] scale-105' : 'text-[var(--muted)] hover:text-[var(--text)]'}`}>
                    <Icon size={20} />
                    <span className="text-[10px] font-bold uppercase tracking-widest">{label}</span>
                </button>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
